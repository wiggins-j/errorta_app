# Copy to $ERRORTA_HOME/liverun/profiles/osrs.yaml, chmod 600, fill every FILL, run list_live_profiles.
#
# This file is INVALID BY CONSTRUCTION: every value only the operator can know
# has been removed and left as a `# FILL:` line. `list_live_profiles` will name
# the first rule it breaks until you have authored all of them.
#
# Every absolute path below is an EXAMPLE of the shape, not a working path —
# repoint each one at your own checkout. See README.md (same directory) for the
# full validator rule list.
version: 1
created_by: operator                # literal; anything else rejected

hosts:
  senditai: {ssh_host: senditai}    # alias resolved via ~/.ssh/config; must already be in known_hosts

tunnels:
  - id: reverse
    host: senditai
    reverse: [{remote_port: 8081, local_port: 8081}, {remote_port: 8082, local_port: 8082}]

launch:                             # ordered; each step must pass its check before the next
  - name: quit-old-client
    local: {argv: [/Users/OPERATOR/GitHub/senditai-ng/jagex-quit]}
    check: {pgrep_absent: "RuneLite.app/Contents/MacOS/RuneLite"}
    timeout_s: 30

  - name: rebuild-jar
    # The gradle task names are quoted because a bare `:` opens a mapping in a
    # YAML flow sequence — the spec's rendering of this line does not parse.
    local: {argv: [./gradlew, ":client:shadowJar", ":client:microbotLatestJar"], cwd: /Users/OPERATOR/GitHub/osrs-reaper}
    # `file_mtime_newer` compares against the moment THIS step started; there is
    # no `than:` key to set.
    check: {file_mtime_newer: {path: /Users/OPERATOR/GitHub/osrs-reaper/runelite-client/build/libs/microbot-shaded.jar}}
    timeout_s: 900

  - name: launch-client
    # Routed through Terminal.app on purpose: Accessibility is per-app, and
    # osascript from an agent shell has been seen failing with -25211.
    local: {argv: [osascript, -e, 'tell application "Terminal" to do script "/Users/OPERATOR/GitHub/senditai-ng/jagex-play"']}
    check: {all: [{file_exists: /Users/OPERATOR/.runelite/.agent-token}, {http: {url: "http://127.0.0.1:8081/state", expect_status: 200}}]}
    timeout_s: 180

  - name: tunnel
    tunnel: reverse
    check: {tunnel_up: reverse}
    timeout_s: 30

  - name: brain
    remote:
      host: senditai
      # FILL: the brain's full invocation as a list of strings. Because it
      # contains `senditai_ng.cli` and `run`, the validator requires
      # --max-session-seconds, --receipt-id and --require-live-feed in it.
      # It must also stay alive past the launcher's ~0.2 s liveness check.
      argv: []                      # FILL — an empty argv is rejected at load
      detach: true
      pidfile: ~/.senditai_ng/liverun.pid
      stdin_file: /Users/OPERATOR/.runelite/.agent-token   # the agent token travels by stdin ONLY
    check: {remote_pid_alive: {host: senditai, pidfile: ~/.senditai_ng/liverun.pid}}
    timeout_s: 60

watch:                              # polled concurrently; wall-clock, never tick counts
  - {id: client-state,  every_s: 15, stall_after_s: 60,  on_stall: stop, probe: {http: {url: "http://127.0.0.1:8081/state"}}}
  - {id: brain-alive,   every_s: 15, stall_after_s: 45,  on_stall: stop, probe: {remote_pid_alive: {host: senditai, pidfile: ~/.senditai_ng/liverun.pid}}}
  - {id: brain-log,     every_s: 30, stall_after_s: 180, on_stall: stop, probe: {remote_file_mtime_advancing: {host: senditai, path: ~/.senditai_ng/liverun.log}}}
  - id: journal-seq
    every_s: 30
    stall_after_s: 180
    on_stall: stop
    probe:
      remote_stdout_advancing:
        host: senditai
        # FILL: the read-only journal query whose output must keep changing,
        # e.g. [sqlite3, -readonly, <db path>, <select max(seq) ...>]. Verify
        # its cost at this cadence before committing to it (spec §7.3).
        argv: []                    # FILL — an empty argv is rejected at load
  - id: feed-live
    every_s: 60
    stall_after_s: 120
    on_stall: stop
    probe:
      remote_stdout_matches:
        host: senditai
        # FILL: the command whose stdout carries the live-feed flag.
        argv: []                    # FILL — an empty argv is rejected at load
        regex: '"event_feed_live":\s*true'
  - {id: session-clock, every_s: 60, stall_after_s: 0,   on_stall: stop, probe: {elapsed_lt_s: 3600}}

evidence:                           # run on every stop, before teardown, bounded and redacted
  - {name: brain-log-tail, remote: {host: senditai, argv: [tail, -n, "200", ~/.senditai_ng/liverun.log]}}
  - name: watcher
    remote:
      host: senditai
      # FILL: the watcher invocation, e.g. [<abs path>/osrs-watcher, --last, "20"].
      argv: []                      # FILL — an empty argv is rejected at load
  - {name: client-window,  window_shot: {pgrep: "RuneLite.app/Contents/MacOS/RuneLite"}}
  - {name: client-state,   http: {url: "http://127.0.0.1:8081/state"}}

teardown:                           # ordered; always; each sub-step records evidence
  - name: kill-marker
    remote:
      host: senditai
      # FILL: the session kill, e.g. [<abs path>/senditai_ng.cli, kill,
      # --session, "$SESSION_ID"]. Confirm it resolves the same --base-dir the
      # run used (spec §7.4).
      argv: []                      # FILL — an empty argv is rejected at load
    timeout_s: 20
  # The logoff literal rests on a CHECK, never on a command's exit status:
  # `remote_signal` exits 0 even when there was no pidfile to signal, so a
  # check-less literal here would be a forged receipt (rule
  # `literal_without_check`). FILL: confirm `gameState` is the field that
  # actually proves logged-out on :8081 (spec §7.2).
  - {name: logoff-wait,   check: {http_json: {url: "http://127.0.0.1:8081/state", path: gameState, not_equals: LOGGED_IN}}, timeout_s: 45, evidence_literal: logoff_verified}
  - {name: brain-stop,    remote_signal: {host: senditai, pidfile: ~/.senditai_ng/liverun.pid, signal: TERM, grace_s: 15, then: KILL}}
  - {name: quit-client,   local: {argv: [/Users/OPERATOR/GitHub/senditai-ng/jagex-quit]}, timeout_s: 30}
  - {name: tunnel-down,   tunnel_close: reverse}

caps:                               # may only be LOWERED below these defaults
  max_launches_per_hour: 2
  min_launch_gap_s: 900
  max_launches_per_day: 8
  max_consecutive_failed_cycles: 2

ban_signals:                        # regexes over any evidence/log text; match -> paused_awaiting_human
  - 'Account is banned'
  - 'Login failed'

# ---------------------------------------------------------------------------
# The fix loop (Slice 2). BOTH keys below are optional: a profile without them
# is a valid live-run profile that watches, stops and reports, and never enters
# the fix loop at all. Read README.md's "The autonomous fix loop" section
# before you enable this — it is the one part of the supervisor that changes
# files in your real checkouts.
#
# Repoint `path` at your own checkouts (the only FILL left in this block); each
# must be an existing directory containing `.git`. `errorta_project` must name
# an Errorta coding project that ALREADY exists — it is resolved at load time,
# so a typo is reported by `list_live_profiles`, not minutes after a stall.
# ---------------------------------------------------------------------------
repos:
  - id: brain
    path: /Users/OPERATOR/GitHub/senditai-ng     # FILL: your checkout
    errorta_project: senditai-ng
    fixable: true                   # default true; false = triage here pauses for a human
    # Which evidence classes this repo OWNS. No class may be claimed by two
    # repos: triage is deterministic precisely because exactly one repo
    # answers, and a shared class would make every cycle ambiguous.
    #
    # `launch_step_failed:<name>` names one of THIS profile's own `launch:`
    # steps and is resolved against them at load, so a typo is a load error and
    # not a rule that silently never fires. Declare it for every launch step
    # whose owner is obvious: the bare `launch_step_failed` class is what a
    # failed step carries otherwise, and no repo can claim that without
    # claiming every launch failure in the profile. A step nobody claims (here:
    # `quit-old-client`, `launch-client`, `tunnel`) makes triage ambiguous and
    # pauses for a human, which is the right answer when the owner is genuinely
    # unclear -- an osascript failure is usually macOS Accessibility, not code.
    classify: [python_traceback, journal_stall, brain_log_stall, brain_pid_dead,
               launch_step_failed:brain]
    deploy:
      # Runs AFTER the merge and BEFORE the relaunch. Argv-identity checked
      # like every other step: byte-identical to what is written here, or it
      # does not run. Note the trailing slashes — rsync semantics, not a typo.
      #
      # NO `check:` here. Slice 1's `exit0` check IS an argv to run, so the
      # design sketch's `check: {exit0: true}` does not validate. A deploy
      # step's action failing is already the failure signal (`deploy_failed:
      # <name>` -> paused_awaiting_human); a check is only worth adding when
      # you have a real one, e.g. an http probe against the deployed box.
      - name: rsync-brain
        local:
          argv: [/usr/bin/rsync, -az, --delete, --exclude, .git,
                 /Users/OPERATOR/GitHub/senditai-ng/, senditai:senditai-ng/]
        timeout_s: 300
  - id: reaper
    path: /Users/OPERATOR/GitHub/osrs-reaper      # FILL: your checkout
    errorta_project: osrs-reaper
    # False on purpose, and not a policy choice: Gradle cannot run inside the
    # seatbelt the acceptance gate executes in, so this project has no
    # registrable gate at all (README, "Why osrs-reaper is fixable: false").
    # Triage landing here pauses for a human.
    fixable: false
    # `rebuild-jar` IS this repo's build, so a failure there is unambiguously
    # the reaper's -- even though `fixable: false` means triage landing here
    # pauses rather than files a task. Attributing it is still worth doing: the
    # channel line then names the repo instead of "ambiguous".
    classify: [jvm_exception, client_port_dead, client_state_stale,
               launch_step_failed:rebuild-jar]
    deploy: []                      # the `rebuild-jar` launch step above redeploys it

fix_loop:
  enabled: true
  max_fix_cycles_per_day: 3         # default 3; may only be LOWERED
  idle_timeout_s: 1200              # default 1200; may only be LOWERED; must be > 600
  accept_timeout_s: 1800            # default 1800; may only be LOWERED
  triage_route: pm                  # the project's own PM route; `pm` is the only value
